<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Symlinks</title>
  <desc id="desc">Two interlocking links.</desc>
  <defs>
    <clipPath id="front-crossing">
      <rect x="80" y="135" width="45" height="50"/>
    </clipPath>
  </defs>
  <rect width="256" height="256" rx="56" fill="#3159d5"/>
  <rect id="back-link" x="47" y="82" width="113" height="73" rx="36" transform="rotate(-38 103.5 118.5)" fill="none" stroke="#a9c0ff" stroke-width="20"/>
  <rect x="96" y="104" width="113" height="73" rx="36" transform="rotate(-38 152.5 140.5)" fill="none" stroke="#ffffff" stroke-width="20"/>
  <use href="#back-link" clip-path="url(#front-crossing)"/>
</svg>
